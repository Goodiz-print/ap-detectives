[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

# Anciennes URLs WordPress
[[redirects]]
  from = "/home/*"
  to = "/"
  status = 301

[[redirects]]
  from = "/qui-sommes-nous/*"
  to = "/l-agence/"
  status = 301

[[redirects]]
  from = "/nous-contacter/*"
  to = "/contact/"
  status = 301

[[redirects]]
  from = "/feed/*"
  to = "/"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

# Fichiers hachés par Astro : cache longue durée
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
